<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Listado de Solicitudes</title>
    <style>
        table { border-collapse: collapse; width: 100%; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        tr:nth-child(even) { background-color: #f9f9f9; }
    </style>
</head>
<body>
    <h1>Solicitudes SIGEO</h1>
    <a th:href="@{/web/solicitudes/nueva}">Nueva Solicitud</a>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Título</th>
                <th>Estado</th>
                <th>Prioridad</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="solicitud : ${solicitudes}">
                <td th:text="${solicitud.id}">ID</td>
                <td th:text="${solicitud.titulo}">Título</td>
                <td th:text="${solicitud.estado}">Estado</td>
                <td th:text="${solicitud.prioridad}">Prioridad</td>
            </tr>
            <tr th:if="${#lists.isEmpty(solicitudes)}">
                <td colspan="4" style="text-align: center;">No hay solicitudes registradas.</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
