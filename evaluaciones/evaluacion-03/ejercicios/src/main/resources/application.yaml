spring:
  datasource:
    url: jdbc:h2:mem:sicor;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  thymeleaf:
    cache: false
server:
  port: 8080
  error:
    include-message: always
sicor:
  temporal:
    enabled: true
    target: ${SICOR_TEMPORAL_TARGET:127.0.0.1:7233}
    connect-timeout: ${SICOR_TEMPORAL_CONNECT_TIMEOUT:5s}
