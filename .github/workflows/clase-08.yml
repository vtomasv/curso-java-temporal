name: Clase 08 - laboratorio de seguridad
on:
  push:
    paths: ['clase-08/**', '.github/workflows/clase-08.yml']
  pull_request:
    paths: ['clase-08/**', '.github/workflows/clase-08.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clase-08/ejercicios
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: clase-08/ejercicios/pom.xml
      - run: ./mvnw --batch-mode clean verify
      - run: bash scripts/check-secrets.sh
