name: Evaluacion 03 - SICOR

on:
  push:
    paths:
      - "evaluaciones/evaluacion-03/**"
      - ".github/workflows/evaluacion-03.yml"
  pull_request:
    paths:
      - "evaluaciones/evaluacion-03/**"
      - ".github/workflows/evaluacion-03.yml"

jobs:
  linea-base:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: evaluaciones/evaluacion-03/ejercicios
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Verificar starter funcional
        run: ./mvnw --batch-mode clean verify

  compilar-perfiles:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: evaluaciones/evaluacion-03/ejercicios
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Compilar pruebas de las siete misiones
        run: ./mvnw --batch-mode -Pev03-all -DskipTests test
