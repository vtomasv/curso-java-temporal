name: Clases 09 y 10 - Temporal

on:
  push:
    paths:
      - "clase-09/**"
      - "clase-10/**"
      - ".github/workflows/clases-09-10.yml"
  pull_request:
    paths:
      - "clase-09/**"
      - "clase-10/**"
      - ".github/workflows/clases-09-10.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    name: ${{ matrix.clase }} / Java 25
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        clase: [clase-09, clase-10]
    defaults:
      run:
        working-directory: ${{ matrix.clase }}/ejercicios
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: ${{ matrix.clase }}/ejercicios/pom.xml
      - run: ./mvnw --batch-mode clean verify
