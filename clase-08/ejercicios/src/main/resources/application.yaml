spring:
  application:
    name: sigeo-clase08
  profiles:
    default: lab
  datasource:
    url: jdbc:h2:mem:sigeodb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
server:
  address: 127.0.0.1
  error:
    include-message: never
    include-stacktrace: never
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
lab:
  password: ${LAB_PASSWORD}
  jwt:
    issuer: https://sigeo.local/clase08
    audience: sigeo-api
    ttl-seconds: 300
