# Docker Compose para el curso Desarrollo de Aplicaciones con Java 25 y Temporal.io
# Uso: docker compose up -d
# Detener: docker compose down -v (elimina volúmenes)

services:
  postgres:
    image: postgres:16-alpine
    container_name: sigeo-postgres
    environment:
      POSTGRES_DB: sigeo
      POSTGRES_USER: sigeo
      POSTGRES_PASSWORD: sigeo_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sigeo"]
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: sigeo-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: sigeo
      RABBITMQ_DEFAULT_PASS: sigeo_dev
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  rabbitmq_data:
